name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK Platform 33 and Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "platforms;android-34" "build-tools;33.0.2"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: cordova platform add android@12.0.1

      - name: Build Android APK (debug)
        run: cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-calculator-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
